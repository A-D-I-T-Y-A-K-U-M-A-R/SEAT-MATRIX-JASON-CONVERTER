<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Excel Copy → JSON Row Converter</title>

<style>
body{
font-family: Arial;
margin:40px;
background:#f5f5f5;
}

textarea{
width:100%;
height:220px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
padding:12px 20px;
font-size:16px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1e40af;
}
</style>

</head>

<body>

<h2>Paste Excel Data</h2>

<textarea id="input"></textarea>

<br>

<button onclick="convert()">Convert</button>

<h2>Output (Row Format)</h2>

<textarea id="output"></textarea>

<script>

function convert(){

let lines = document.getElementById("input").value.split("\n");

let result = [];

lines.forEach(function(line, index){

line = line.trim();

// skip empty + header
if(line === "" || index === 0) return;

// Excel tab split
let parts = line.split("\t");

if(parts.length >= 6){

let row = `{ "Institute": "${parts[0].trim()}", "Academic Program Name": "${parts[1].replace(/"/g,"").trim()}", "Quota": "${parts[2].trim()}", "Gender": "${parts[3].trim()}", "Opening Rank": ${Number(parts[4])}, "Closing Rank": ${Number(parts[5])} }`;

result.push(row);

}

});

// 🔥 COMMA LOGIC (last me comma nahi)
let finalOutput = "";

result.forEach((row, i)=>{
if(i !== result.length - 1){
finalOutput += row + ",\n";
}else{
finalOutput += row;
}
});

document.getElementById("output").value = finalOutput;

}

</script>

</body>
</html>
