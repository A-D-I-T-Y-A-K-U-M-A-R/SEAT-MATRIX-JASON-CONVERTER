<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Smart JSON Converter</title>

<style>
body{
font-family: Arial;
margin:40px;
background:#f5f5f5;
}

textarea{
width:100%;
height:250px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
padding:12px 20px;
font-size:16px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1e40af;
}
</style>

</head>

<body>

<h2>Paste Excel Data</h2>

<textarea id="input"></textarea>

<br>

<button onclick="convert()">Convert</button>

<h2>Output JSON</h2>

<textarea id="output"></textarea>

<script>

// 🔥 SMART CLEAN FUNCTION
function clean(text){
text = text.trim();

// remove only outer quotes (not inner content)
if(text.startsWith('"') && text.endsWith('"')){
text = text.slice(1, -1);
}

// remove accidental double quotes anywhere
text = text.replace(/""/g, '"');

return text.trim();
}

function convert(){

let lines = document.getElementById("input").value.split("\n");
let result = [];

lines.forEach(function(line){

line = line.trim();
if(line==="") return;

// Excel tab split
let parts = line.split("\t");

if(parts.length >= 6){

let row = `{ "Institute": "${clean(parts[0])}", "Academic Program Name": "${clean(parts[1])}", "Quota": "${clean(parts[2])}", "Gender": "${clean(parts[3])}", "Opening Rank": ${Number(parts[4])}, "Closing Rank": ${Number(parts[5])} }`;

result.push(row);
}

});

// 🔥 last comma fix
let finalOutput = "";

result.forEach((row,i)=>{
if(i !== result.length-1){
finalOutput += row + ",\n";
}else{
finalOutput += row;
}
});

document.getElementById("output").value = finalOutput;

}

</script>

</body>
</html>
