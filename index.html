<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced JSON Converter (7 Columns)</title>

<style>
body{
font-family: Arial;
margin:30px;
background:#f5f5f5;
}

textarea{
width:100%;
height:120px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
padding:12px 20px;
font-size:16px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#1e40af;
}

.section{
margin-bottom:25px;
}
</style>
</head>

<body>

<h1>🔥 9 FILE JSON CONVERTER (7 COLUMNS)</h1>

<div id="inputs"></div>

<button onclick="convert()">GET JSON</button>

<h2>FINAL JSON OUTPUT</h2>
<textarea id="output" style="height:320px;"></textarea>

<script>

// 🔥 ROUND NAMES (EXACT SAME)
const rounds = [
"ROUND 1 JOSSA 2025",
"ROUND 2 JOSSA 2025",
"ROUND 3 JOSSA 2025",
"ROUND 4 JOSSA 2025",
"ROUND 5 JOSSA 2025",
"ROUND 6 JOSSA 2025",
"ROUND 1 CSAB 2025",
"ROUND 2 CSAB 2025",
"ROUND 3 CSAB 2025"
];

// 🔥 CREATE INPUT BOXES
let container = document.getElementById("inputs");

rounds.forEach((r,i)=>{
let div = document.createElement("div");
div.className = "section";

div.innerHTML = `<h3>${r}</h3>
<textarea id="input${i}" placeholder="Paste Excel TXT here..."></textarea>`;

container.appendChild(div);
});

// 🔥 CLEAN FUNCTION
function clean(text){
text = text.trim();

if(text.startsWith('"') && text.endsWith('"')){
text = text.slice(1,-1);
}

text = text.replace(/""/g,'"');

return text.trim();
}

// 🔥 CONVERT FUNCTION
function convert(){

let finalJSON = "{\n";

rounds.forEach((round,index)=>{

let input = document.getElementById("input"+index).value;
let lines = input.split("\n");

let rows = [];

lines.forEach(line=>{

line = line.trim();
if(line==="") return;

let parts = line.split("\t");

// 🔥 NOW 7 COLUMNS REQUIRED
if(parts.length >= 7){

let row = `{ "Institute": "${clean(parts[0])}", "Academic Program Name": "${clean(parts[1])}", "Quota": "${clean(parts[2])}", "Gender": "${clean(parts[3])}", "Opening Rank": ${Number(parts[4])}, "Closing Rank": ${Number(parts[5])}, "Seat Type": "${clean(parts[6])}" }`;

rows.push(row);
}

});

// 🔥 ROUND HEADER
finalJSON += `"${round}": [\n\n`;

rows.forEach((r,i)=>{
if(i !== rows.length-1){
finalJSON += r + ",\n";
}else{
finalJSON += r + "\n";
}
});

finalJSON += "\n]";

if(index !== rounds.length-1){
finalJSON += ",\n\n";
}

});

finalJSON += "\n}";

document.getElementById("output").value = finalJSON;

}

</script>

</body>
</html>
