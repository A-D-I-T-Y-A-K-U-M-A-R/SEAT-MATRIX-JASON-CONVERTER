<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel to JSON (9 Files Direct Upload)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
font-family: Arial;
margin:30px;
background:#f5f5f5;
}

.section{
margin-bottom:20px;
}

button{
padding:12px 20px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

textarea{
width:100%;
height:300px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🔥 DIRECT EXCEL → JSON (9 FILES)</h1>

<div id="inputs"></div>

<button onclick="convert()">GET JSON</button>

<textarea id="output"></textarea>

<script>

const rounds = [
"ROUND 1 JOSSA 2025",
"ROUND 2 JOSSA 2025",
"ROUND 3 JOSSA 2025",
"ROUND 4 JOSSA 2025",
"ROUND 5 JOSSA 2025",
"ROUND 6 JOSSA 2025",
"ROUND 1 CSAB 2025",
"ROUND 2 CSAB 2025",
"ROUND 3 CSAB 2025"
];

// create file inputs
let container = document.getElementById("inputs");

rounds.forEach((r,i)=>{
let div = document.createElement("div");
div.className = "section";

div.innerHTML = `<h3>${r}</h3>
<input type="file" id="file${i}" accept=".xlsx,.csv,.txt">`;

container.appendChild(div);
});

function clean(text){
if(!text) return "";
text = text.toString().trim();

if(text.startsWith('"') && text.endsWith('"')){
text = text.slice(1,-1);
}

text = text.replace(/""/g,'"');

return text.trim();
}

async function readFile(file){
return new Promise((resolve)=>{

let reader = new FileReader();

reader.onload = function(e){
let data = new Uint8Array(e.target.result);
let workbook = XLSX.read(data, {type:'array'});
let sheet = workbook.Sheets[workbook.SheetNames[0]];
let json = XLSX.utils.sheet_to_json(sheet, {header:1});
resolve(json);
};

reader.readAsArrayBuffer(file);

});
}

async function convert(){

let finalJSON = "{\n";

for(let index=0; index<rounds.length; index++){

let fileInput = document.getElementById("file"+index);
let file = fileInput.files[0];

let rows = [];

if(file){

let data = await readFile(file);

data.forEach((parts,index)=>{

// 🔥 SKIP HEADER ROW
if(index === 0) return;

if(parts.length >= 7){

let row = `{ "Institute": "${clean(parts[0])}", "Academic Program Name": "${clean(parts[1])}", "Quota": "${clean(parts[2])}", "Gender": "${clean(parts[3])}", "Opening Rank": ${Number(parts[4])}, "Closing Rank": ${Number(parts[5])}, "Seat Type": "${clean(parts[6])}" }`;

rows.push(row);

}

});

}

finalJSON += `"${rounds[index]}": [\n\n`;

rows.forEach((r,i)=>{
if(i !== rows.length-1){
finalJSON += r + ",\n";
}else{
finalJSON += r + "\n";
}
});

finalJSON += "\n]";

if(index !== rounds.length-1){
finalJSON += ",\n\n";
}

}

finalJSON += "\n}";

document.getElementById("output").value = finalJSON;

}

</script>

</body>
</html>
