<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>College JSON Converter</title>

<style>

body{
font-family: Arial;
margin:40px;
background:#f5f5f5;
}

h1{
color:#222;
}

textarea{
width:100%;
height:250px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
padding:12px 20px;
font-size:16px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1e40af;
}

</style>

</head>

<body>

<h1>College Data → JSON Converter</h1>

<p>Paste your data below</p>

<textarea id="input"></textarea>

<br>

<button onclick="convert()">Convert to JSON</button>

<h2>Output JSON</h2>

<textarea id="output"></textarea>

<script>

function getType(inst){

inst = inst.toLowerCase()

if(inst.includes("indian institute of technology"))
return "IIT"

if(inst.includes("national institute of technology"))
return "NIT"

if(inst.includes("information technology"))
return "IIIT"

return "GFTI"

}

function clean(text){
return text.replace(/"/g, "").trim(); // 🔥 FIX: remove extra quotes
}

function convert(){

let lines=document.getElementById("input").value.split("\n")

let result=[]

lines.forEach(function(line){

line=line.trim()

if(line==="") return

let parts=line.split(/\s{2,}/)

if(parts.length>=2){

let inst=clean(parts[0])
let branch=clean(parts.slice(1).join(" "))
let type=getType(inst)

let row = `{"inst":"${inst}","branch":"${branch}","type":"${type}"}`

result.push(row)

}

})

// 🔥 LAST COMMA FIX
let finalOutput=""

result.forEach((row,i)=>{
if(i !== result.length-1){
finalOutput += row + ",\n"
}else{
finalOutput += row
}
})

document.getElementById("output").value=finalOutput

}

</script>

</body>
</html>
