<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Seat Matrix → preferred_data.json Converter</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
font-family: Arial;
margin:40px;
background:#f5f5f5;
}

h1{ color:#222; }

textarea{
width:100%;
height:200px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
padding:12px 20px;
font-size:16px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
margin-top:15px;
}

button:hover{ background:#1e40af; }

#status{
margin-top:15px;
font-weight:bold;
color:green;
}
</style>

</head>

<body>

<h1>Excel → preferred_data.json Converter</h1>

<p>Select all 9 Excel files</p>

<input type="file" id="files" multiple accept=".xlsx">

<br>

<button onclick="convertExcel()">CONVERT EXCEL</button>

<div id="status"></div>

<h2>Preview JSON</h2>
<textarea id="output"></textarea>

<script>

let finalData = {
  "ROUND 1 JOSSA 2025": [],
  "ROUND 2 JOSSA 2025": [],
  "ROUND 3 JOSSA 2025": [],
  "ROUND 4 JOSSA 2025": [],
  "ROUND 5 JOSSA 2025": [],
  "ROUND 6 JOSSA 2025": [],
  "ROUND 1 CSAB 2025": [],
  "ROUND 2 CSAB 2025": [],
  "ROUND 3 CSAB 2025": []
};

// 🔥 FILE NAME CLEANER
function normalize(name){
  return name.replace(".xlsx","").toUpperCase().trim();
}

// 🔥 MAIN CONVERSION
function convertExcel(){

let files = document.getElementById("files").files;

if(files.length === 0){
  alert("Select Excel files first");
  return;
}

let promises = [];

for(let file of files){

promises.push(new Promise(resolve=>{

let reader = new FileReader();

reader.onload = function(e){

let data = new Uint8Array(e.target.result);

let workbook = XLSX.read(data, {type:"array"});
let sheet = workbook.Sheets[workbook.SheetNames[0]];

// 🔥 DIRECT JSON (SAME AS EXCEL)
let json = XLSX.utils.sheet_to_json(sheet);

// 🔥 MATCH FILE NAME
let key = Object.keys(finalData).find(k =>
  normalize(file.name).includes(k)
);

if(key){
  finalData[key] = json;
}else{
  console.warn("File not matched:", file.name);
}

resolve();

};

reader.readAsArrayBuffer(file);

}));

}

Promise.all(promises).then(()=>{

document.getElementById("status").innerText = "✅ Conversion Done";

// preview
document.getElementById("output").value =
JSON.stringify(finalData, null, 2);

});

}

// 🔥 DOWNLOAD FUNCTION
function downloadJSON(){

let blob = new Blob(
[JSON.stringify(finalData,null,2)],
{type:"application/json"}
);

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "preferred_data.json";
a.click();

}

</script>

<br>
<button onclick="downloadJSON()">DOWNLOAD JSON</button>

</body>
</html>
